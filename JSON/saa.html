        rel="stylesheet"
    >

    <!-- OMA CSS -->
    <link rel="stylesheet" href="json-style.css">
</head>

<body>

    <!-- NAVIGAATIO -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">JSON-tehtävä</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Avaa navigaatio"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Etusivu</a>

                    <li class="nav-item">

                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- SISÄLTÖ -->
    <main class="container py-5">

        <h1>Sää Helsingissä</h1>

        <div id="vastaus"></div>

    </main>

    <!-- BOOTSTRAP JAVASCRIPTI -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- SÄÄDATAN HAKEMINEN -->
<script>
    fetch("https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric")
        .then(function (response) {
            return response.json();
        })
        .then(function (data) {
            kerro(data);
        });

    function kerro(data) {

    let tiedot = "<h2>" + data.weather[0].description + "</h2>";
    tiedot += "<p>Lämpötila: " + data.main.temp + " °C</p>";
    tiedot += "<p>Tuuli: " + data.wind.speed + " m/s</p>";

    let kuva = "https://openweathermap.org/img/wn/" + data.weather[0].icon + "@2x.png";

    tiedot += "<p><img src=" + kuva + "></p>";

    let aika = new Date();

    tiedot += "<p>Sivu ladattu: " + aika + "</p>";

    document.getElementById("vastaus").innerHTML = tiedot;
}
</script>

</body>
</html>
