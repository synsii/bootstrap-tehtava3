<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon haku</title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- OMA CSS -->
    <link rel="stylesheet" href="json-style.css">
</head>

<body>

    <!-- NAVIGAATIO -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">JSON-tehtävä</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Avaa navigaatio"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Etusivu</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="toteutus.html">Toteutus</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="poke.html">Pokemon</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="saa.html">Sää</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <!-- SISÄLTÖ -->
    <main class="container py-5">

        <h1>Pokemon haku</h1>

        <p>
            <input type="text" id="pokemonName" placeholder="Enter Pokemon name">
            <button onclick="poke()">Hae</button>
        </p>
        <div id="vastaus"></div>
        <div id="nimi">Kirjoita laatikkoon Pokemonin nimi</div>

        <p id="kuva2"></p>
        <div id="kaanna"></div>

    </main>

    <!-- BOOTSTRAP JAVASCRIPTI -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

<!-- POKEMON DATAN HAKEMINEN -->
<script>
    let name;

    function poke() {

    const pokeName = document.getElementById("pokemonName").value.toLowerCase();
    name = document.getElementById("pokemonName").value;

    fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)
        .then(function (response) {
            return response.json();
        })
        .then(function (responseJson) {
            pokekuva(responseJson);
        })
        .catch(function (error) {
            document.getElementById("vastaus").innerHTML =
                "<p>Tietoa ei pystytä hakemaan</p>";
        });
}
    let pokeObj;
    function pokekuva(obj) {
        pokeObj = obj;
        let pokeurl = obj.sprites.front_default;

        document.getElementById("kuva2").innerHTML =
            "<img src=" + pokeurl + ">";

        document.getElementById("nimi").innerHTML =
            "<b>" + name + "</b>";

        document.getElementById("pokemonName").value = "";
        document.getElementById("kaanna").innerHTML =
    "<button onclick='kaannaPoke()'>Käännä Poke</button>";
    }

    function kaannaPoke() {

    let pokeurl = pokeObj.sprites.back_default;

    document.getElementById("kuva2").innerHTML =
        "<img src=" + pokeurl + ">";

    document.getElementById("vastaus").innerHTML =
        "Korkeus: " + pokeObj.height + "<br>" +
        "Paino: " + pokeObj.weight + "<br>" +
        "Peruskokemus: " + pokeObj.base_experience;
}
</script>

</body>
</html>
